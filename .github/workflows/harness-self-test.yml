name: harness-self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the provider-backed Azure verification
        required: true
        default: false
        type: boolean

jobs:
  offline:
    name: Deterministic offline verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic harness checks
        run: |
          python3 test_offline.py
          python3 test_integration.py

  live:
    name: Explicit Azure verification
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Azure configuration
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: |
          test -n "$AZURE_FOUNDRY_API_KEY" || { echo 'AZURE_FOUNDRY_API_KEY is required when run_live=true' >&2; exit 1; }
          case "$AZURE_FOUNDRY_BASE_URL" in
            https://*) ;;
            *) echo 'AZURE_FOUNDRY_BASE_URL must be an https URL when run_live=true' >&2; exit 1 ;;
          esac
      - name: Run live pattern harness
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: python3 test_live.py
      - name: Run live autological tests
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: python3 test_meta.py
      - name: Run live meta-cognitive tests
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: python3 test_metacognition.py
      - name: Run live engineering tests
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: python3 test_engineering.py
